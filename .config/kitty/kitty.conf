# Gruvbox dark, square and minimal
font_family      JetBrains Mono
font_size        11
window_padding_width 8
cursor_shape     block
cursor_blink_interval 0
enable_audio_bell no
confirm_os_window_close 0

background #282828
foreground #ebdbb2
cursor     #ebdbb2
cursor_text_color #282828
selection_background #504945
selection_foreground #ebdbb2
url_color #83a598

color0  #282828
color8  #928374
color1  #cc241d
color9  #fb4934
color2  #98971a
color10 #b8bb26
color3  #d79921
color11 #fabd2f
color4  #458588
color12 #83a598
color5  #b16286
color13 #d3869b
color6  #689d6a
color14 #8ec07c
color7  #a89984
color15 #ebdbb2

tab_bar_style powerline
active_tab_background   #ebdbb2
active_tab_foreground   #282828
inactive_tab_background #3c3836
inactive_tab_foreground #a89984

# see-through background (text stays solid), blurred by Hyprland
background_opacity 0.85
dynamic_background_opacity yes
