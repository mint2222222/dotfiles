# Gruvbox, square lock screen
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper
    color = rgb(282828)
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgb(ebdbb2)
    font_size = 72
    font_family = JetBrains Mono ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgb(a89984)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    rounding = 0
    outline_thickness = 2
    outer_color = rgb(ebdbb2)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    font_family = JetBrains Mono
    check_color = rgb(ebdbb2)
    fail_color = rgb(cc241d)
    fail_text = wrong password
    placeholder_text = password…
    dots_size = 0.25
    dots_rounding = 0
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
